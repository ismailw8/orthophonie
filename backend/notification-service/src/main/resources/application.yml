server:
  port: 8084

spring:
  application:
    name: notification-service

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx}
  auth-token: ${TWILIO_AUTH_TOKEN:your_auth_token}
  phone-number: ${TWILIO_PHONE_NUMBER:+1234567890}
  whatsapp-number: ${TWILIO_WHATSAPP_NUMBER:whatsapp:+14155238886}

jwt:
  secret: dGhpc2lzYXZlcnlsb25nc2VjcmV0a2V5Zm9ydGhlb3J0aG9waG9uaXN0ZXByb2plY3QyMDI2

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.orthophoniste.notification: DEBUG
    com.twilio: WARN