server:
  port: 8888
spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/orthophoniste}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/orthophoniste/protocol/openid-connect/certs}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${ALLOWED_ORIGINS:http://localhost:5180}
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: "*"
                allowCredentials: true
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates: [Path=/api/auth/**]
            - id: rdv-service
              uri: lb://rdv-service
              predicates: ["Path=/api/rdv/**,/api/rdv"]
            - id: suivi-service
              uri: lb://suivi-service
              predicates: [Path=/api/suivi/**]
rate-limit:
  login:
    max-requests: ${RATE_LIMIT_LOGIN_MAX:10}
    window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:300}
  appointment:
    max-requests: ${RATE_LIMIT_APPOINTMENT_MAX:20}
    window-seconds: ${RATE_LIMIT_APPOINTMENT_WINDOW_SECONDS:3600}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
management.endpoints.web.exposure.include: health,info
