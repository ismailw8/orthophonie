server:
  port: 8083

spring:
  application:
    name: suivi-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/suivi_db}
      database: suivi_db

jwt:
  secret: dGhpc2lzYXZlcnlsb25nc2VjcmV0a2V5Zm9ydGhlb3J0aG9waG9uaXN0ZXByb2plY3QyMDI2

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.orthophoniste.suivi: DEBUG
    org.springframework.security: INFO