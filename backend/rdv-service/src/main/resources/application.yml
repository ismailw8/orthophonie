server:
  port: 8082

spring:
  application:
    name: rdv-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/rdv_db}
      database: rdv_db

jwt:
  secret: dGhpc2lzYXZlcnlsb25nc2VjcmV0a2V5Zm9ydGhlb3J0aG9waG9uaXN0ZXByb2plY3QyMDI2

feign:
  circuitbreaker:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.orthophoniste.rdv: DEBUG
    org.springframework.security: INFO